[project]
name = "hotcards"
version = "0.1.0"
description = "Local-first AI-assisted authoring for illustrated interactive card stacks"
authors = [
    { name = "Nicolas Villar" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.20",
    "mflux>=0.19.1",
    "mlx>=0.30",
    "numpy>=1.24",
    "pillow>=12",
    "pydantic>=2",
    "pyside6>=6.11.1",
    "sentencepiece>=0.2",
]

[project.scripts]
hotcards = "hotcards.main:main"
hotcards-eval = "hotcards.evaluation.cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/hotcards/vendor/stable_audio_3_mlx"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
